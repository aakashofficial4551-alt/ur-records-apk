name: Build UR RECORDS APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Capacitor project
        run: |
          mkdir -p www
          cat << 'EOF' > www/index.html
          <!DOCTYPE html>
          <html>
          <head><meta charset="utf-8"><title>UR RECORDS</title></head>
          <body style="background:#060609;color:#f8fafc;font-family:sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;">
            <p>Loading UR RECORDS...</p>
          </body>
          </html>
          EOF

          cat << 'EOF' > package.json
          {
            "name": "ur-records-apk",
            "version": "1.0.0",
            "dependencies": {
              "@capacitor/core": "^6.1.2",
              "@capacitor/android": "^6.1.2"
            },
            "devDependencies": {
              "@capacitor/cli": "^6.1.2"
            }
          }
          EOF

          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.urrecords.app",
            "appName": "UR RECORDS",
            "webDir": "www",
            "server": {
              "url": "https://study-tracker-grzv.onrender.com/dashboard/",
              "cleartext": false
            },
            "android": {
              "backgroundColor": "#060609",
              "allowMixedContent": false
            }
          }
          EOF

          npm install
          npx cap add android

      - name: Add GPS, Notifications and Dark Theme
        run: |
          python3 - << 'PY'
          manifest_path = "android/app/src/main/AndroidManifest.xml"
          with open(manifest_path, "r") as f:
              txt = f.read()
          perms = (
              '    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n'
              '    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n'
              '    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n'
          )
          if "ACCESS_FINE_LOCATION" not in txt:
              txt = txt.replace("<application", perms + "\n    <application", 1)
          with open(manifest_path, "w") as f:
              f.write(txt)

          styles_path = "android/app/src/main/res/values/styles.xml"
          with open(styles_path, "r") as f:
              st = f.read()
          dark_items = (
              '        <item name="android:windowBackground">#060609</item>\n'
              '        <item name="android:statusBarColor">#060609</item>\n'
              '        <item name="android:navigationBarColor">#060609</item>'
          )
          st = st.replace('<item name="android:background">@null</item>', dark_items)
          st = st.replace('<item name="android:background">@drawable/splash</item>', '<item name="android:background">#060609</item>')
          with open(styles_path, "w") as f:
              f.write(st)
          PY

      - name: Apply App Icon
        run: |
          if [ ! -f icon-512.png ]; then
            curl -fsSL https://study-tracker-grzv.onrender.com/static/icons/icon-512.png -o icon-512.png || true
          fi
          if [ -f icon-512.png ]; then
            pip install --quiet pillow
            python3 - << 'PY'
          import os, shutil
          from PIL import Image

          img = Image.open("icon-512.png").convert("RGBA")
          res_dir = "android/app/src/main/res"
          anydpi = os.path.join(res_dir, "mipmap-anydpi-v26")
          if os.path.exists(anydpi):
              shutil.rmtree(anydpi)

          sizes = {
              "mipmap-mdpi": 48,
              "mipmap-hdpi": 72,
              "mipmap-xhdpi": 96,
              "mipmap-xxhdpi": 144,
              "mipmap-xxxhdpi": 192,
          }
          for folder, sz in sizes.items():
              out_dir = os.path.join(res_dir, folder)
              os.makedirs(out_dir, exist_ok=True)
              resized = img.resize((sz, sz), Image.LANCZOS)
              resized.save(os.path.join(out_dir, "ic_launcher.png"))
              resized.save(os.path.join(out_dir, "ic_launcher_round.png"))
          PY
          fi

      - name: Build Android APK
        run: |
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/UR-RECORDS.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: UR-RECORDS-APK
          path: android/app/build/outputs/apk/debug/UR-RECORDS.apk
